<script>
(()=>{const c=document.getElementById('world'),ctx=c.getContext('2d');let W=0,H=0,dpr=1,zoom=1,panX=0,panY=0,interiorHomeId='',interiorZoom=1,interiorPanX=0,interiorPanY=0,homeListOpen=false,paused=false,minute=25,hour=15,day=2,calendarDay=0,selected=0,tab='walk',last=0,elapsed=0;const defaultResidents=[{id:'nagisumi',name:'凪澄',profile:{role:'住人',detail:'28歳・195cm／銀髪・青い瞳／落ち着いていて責任感が強い'},needs:{energy:86,hunger:72,mood:82},x:390,y:470,tx:500,ty:570,phase:0,activity:'夜玖を見守りながら散歩中',color:'#252a32',hair:'#c9cbd1',kind:'nagisumi',scale:1.13},{id:'yaku',name:'夜玖',profile:{role:'住人',detail:'19歳・162cm／黒髪・眼鏡・ヘッドホン／寡黙でゲーム好き'},needs:{energy:74,hunger:68,mood:88},x:520,y:800,tx:430,ty:690,phase:2,activity:'のんびり散歩中',color:'#e6e3df',hair:'#24232a',kind:'yaku',scale:.94}];const chars=defaultResidents.map(p=>({...p,money:5000,workPayDay:-1,incomeMode:'fixed',fixedIncome:1500,randomIncomeMin:0,randomIncomeMax:0,moneyHistory:[],profile:{...p.profile},needs:{...p.needs}}));let bond={affection:68,trust:76,intimacy:61};let relationships={};let diary=[{time:'15:25',text:'凪澄と夜玖が川辺のこみちを散歩している。'}];let memories=[];let unlockedEvents={};let expandedRelationId='';let editingResidentId='';let residentPageId='';let sharedGoal='';let goalTicks=0;let lastRoutine=0;let lastRecoveryStamp=-1;let lastBondStamp=-1;let lastSocialPairId='';let sameSocialPairCount=0;
const places=[
 {id:'home',name:'西の住宅',icon:'🏡',x:645,y:340,type:'home',description:'住人たちが暮らす家',actions:['帰宅','休憩']},
 {id:'home2',name:'東の住宅',icon:'🏠',x:250,y:850,type:'home',description:'住人たちが暮らす家',actions:['帰宅','休憩']},
 {id:'cafe',name:'喫茶こもれび',icon:'☕',x:240,y:290,type:'cafe',description:'飲み物を楽しめる喫茶店',actions:['食事','休憩','デート']},
 {id:'plaza',name:'川辺の広場',icon:'🌳',x:600,y:760,type:'outdoor',description:'川辺の散歩や休憩を楽しめる広場',actions:['散歩','休憩']},
 {id:'bench-river',name:'川辺のベンチ',icon:'🪑',x:795,y:800,type:'bench',description:'水の流れを眺めながら休めるベンチ',actions:['休憩']},
 {id:'bench-path',name:'こみちのベンチ',icon:'🪑',x:90,y:760,type:'bench',description:'木陰のそばでひと休みできるベンチ',actions:['休憩']},
 {id:'bridge',name:'小さな橋',icon:'🌉',x:765,y:738,type:'bridge',description:'川辺をつなぐ小さな橋。水辺の景色を眺められる場所',actions:['散歩','景色を見る']},
 {id:'flower-west',name:'西の花壇',icon:'🌼',x:140,y:425,type:'garden',description:'色とりどりの花が咲く、住宅近くの花壇',actions:['花を見る']},
 {id:'flower-east',name:'東の花壇',icon:'🌷',x:610,y:500,type:'garden',description:'広場のそばにある、日当たりのよい花壇',actions:['花を見る']},
 {id:'flower-south',name:'南の花壇',icon:'🌻',x:115,y:920,type:'garden',description:'こみちの南側にある小さな花壇',actions:['花を見る']}
];
function getPlace(id){return places.find(place=>place.id===id)||null}
const SAVE_KEY='komichi-life-save-v1';
let saveElapsed=0;
function pairIdFor(a,b){const ids=[typeof a==='string'?a:a.id,typeof b==='string'?b:b.id].sort();return ids[0]==='nagisumi'&&ids[1]==='yaku'?'nagisumi-yaku':'pair:'+encodeURIComponent(JSON.stringify(ids))}
function residentById(id){return chars.find(p=>p.id===id)||null}
function relationshipLabel(ids){return ids.map(id=>residentById(id)?.name||id).join(' ＆ ')}
function ensureRelationship(a,b,seed){
 const ids=[typeof a==='string'?a:a.id,typeof b==='string'?b:b.id].sort(),id=pairIdFor(ids[0],ids[1]);
 if(!residentById(ids[0])||!residentById(ids[1])||ids[0]===ids[1])return null;
 if(!relationships[id]){
  const original=id==='nagisumi-yaku';
  relationships[id]={id,residentIds:ids,label:relationshipLabel(ids),status:original?'恋人':'知り合い',affection:original?68:20,trust:original?76:20,intimacy:original?61:10,lastInteractionStamp:-1,lastSocialStamp:-1,lastSocialVisitStamp:-1,...(seed||{})};
 }
 const r=relationships[id];r.id=id;r.residentIds=ids;r.label=relationshipLabel(ids);
 ['affection','trust','intimacy'].forEach(k=>{r[k]=Number.isFinite(r[k])?Math.max(0,Math.min(100,r[k])):(id==='nagisumi-yaku'?bond[k]:20)});
 if(typeof r.status!=='string')r.status=id==='nagisumi-yaku'?'恋人':'知り合い';
 if(!Number.isFinite(r.lastInteractionStamp))r.lastInteractionStamp=-1;
 if(!Number.isFinite(r.lastSocialStamp))r.lastSocialStamp=-1;
 if(!Number.isFinite(r.lastSocialVisitStamp))r.lastSocialVisitStamp=-1;
 return r;
}
function ensureAllRelationships(){
 for(let i=0;i<chars.length;i++)for(let j=i+1;j<chars.length;j++)ensureRelationship(chars[i],chars[j]);
 const primary=ensureRelationship('nagisumi','yaku');if(primary)bond=primary;
 return relationships;
}
function relationshipFor(a,b){return ensureRelationship(a,b)}
function restoreRelationships(saved,legacyBond){
 relationships={};
 if(saved&&typeof saved==='object')Object.entries(saved).forEach(([id,value])=>{
  if(!value||!Array.isArray(value.residentIds)||value.residentIds.length!==2)return;
  const [a,b]=value.residentIds;if(!residentById(a)||!residentById(b))return;
  const key=pairIdFor(a,b);relationships[key]={...value,id:key,residentIds:[a,b].sort()};
 });
 if(!relationships['nagisumi-yaku']&&legacyBond&&typeof legacyBond==='object')relationships['nagisumi-yaku']={id:'nagisumi-yaku',residentIds:['nagisumi','yaku'],label:'凪澄 ＆ 夜玖',status:'恋人',affection:legacyBond.affection,trust:legacyBond.trust,intimacy:legacyBond.intimacy,lastInteractionStamp:-1};
 ensureAllRelationships();
}
function relationMeter(label,value,key){return '<div class="meter" data-relation-stat="'+key+'"><span>'+label+'</span><div class="track"><div class="fill" style="width:'+Math.round(value)+'%"></div></div><b>'+Math.round(value)+'</b></div>'}
function saveGame(){
 try{
  const data={version:3,savedAt:Date.now(),clock:{hour,minute,day,calendarDay},bond:{affection:bond.affection,trust:bond.trust,intimacy:bond.intimacy},relationships,lastSocialPairId,sameSocialPairCount,diary:diary.slice(0,300),memories:memories.slice(0,100),unlockedEvents,sharedGoal,goalTicks,lastRoutine,lastRecoveryStamp,lastBondStamp,selected,view:{zoom,panX,panY},residents:chars.map(p=>({...p,profile:{...p.profile},needs:{...p.needs}}))};
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
 }catch(e){console.warn('セーブに失敗しました',e)}
}
function loadGame(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
  const data=JSON.parse(raw);if(!data||![1,2,3].includes(data.version))return false;lastSocialPairId=typeof data.lastSocialPairId==='string'?data.lastSocialPairId:'';sameSocialPairCount=Number.isFinite(data.sameSocialPairCount)?Math.max(0,data.sameSocialPairCount):0;
  if(data.clock){hour=Number.isFinite(data.clock.hour)?data.clock.hour:hour;minute=Number.isFinite(data.clock.minute)?data.clock.minute:minute;day=Number.isFinite(data.clock.day)?data.clock.day:day;calendarDay=Number.isFinite(data.clock.calendarDay)?data.clock.calendarDay:calendarDay}
  
  if(data.bond)Object.keys(bond).forEach(k=>{if(Number.isFinite(data.bond[k]))bond[k]=Math.max(0,Math.min(100,data.bond[k]))});
  if(Array.isArray(data.diary))diary=data.diary.filter(d=>d&&typeof d.time==='string'&&typeof d.text==='string').slice(0,300);if(Array.isArray(data.memories))memories=data.memories.filter(m=>m&&typeof m.time==='string'&&typeof m.title==='string'&&typeof m.text==='string'&&(m.pairId||m.title==='ふたりの喫茶店時間')).map(m=>m.title==='ふたりの喫茶店時間'?{...m,pairId:m.pairId||'nagisumi-yaku'}:m).slice(0,100);if(data.unlockedEvents&&typeof data.unlockedEvents==='object')unlockedEvents=data.unlockedEvents;
  sharedGoal=typeof data.sharedGoal==='string'?data.sharedGoal:'';goalTicks=Number.isFinite(data.goalTicks)?data.goalTicks:0;lastRoutine=Number.isFinite(data.lastRoutine)?data.lastRoutine:0;lastRecoveryStamp=Number.isFinite(data.lastRecoveryStamp)?data.lastRecoveryStamp:-1;lastBondStamp=Number.isFinite(data.lastBondStamp)?data.lastBondStamp:-1;
