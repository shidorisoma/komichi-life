function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(c);resize();
function poly(points,fill,stroke='#9e8b6c',lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function flower(x,y,s=1){const colors=['#fff7dd','#f4a6a0','#f4cf59','#e9d9f3'];for(let j=0;j<5;j++){let a=j*Math.PI*2/5;ellipse(x+Math.cos(a)*3*s,y+Math.sin(a)*3*s,2.5*s,3*s,colors[(Math.floor(x+y)+j)%colors.length])}ellipse(x,y,2*s,2*s,'#d9a947')}

function drawWorld(){ctx.clearRect(0,0,W,H);ctx.save();const fit=Math.min(W/900,H/1400)*1.04;ctx.translate(W/2,H/2);ctx.scale(fit*zoom,fit*zoom);ctx.translate(-450+panX,-720+panY);

 ctx.strokeStyle='#c4d9c9';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(778,210);ctx.bezierCurveTo(720,370,895,480,808,650);ctx.bezierCurveTo(730,820,910,950,812,1160);ctx.stroke();
 // 川辺の石と水面のきらめき
 for(let i=0;i<22;i++){let x=790+(i%4)*34+(i%2)*9,y=260+i*43;ellipse(x,y,5+(i%3)*2,2,'#d7e4d1')}
 // 街の広場と小道
 poly([[0,350],[480,180],[755,320],[760,1120],[430,1370],[0,1160]],'#d9c49d','#a58d68',3);
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#c3ad83';ctx.lineWidth=104;ctx.beginPath();ctx.moveTo(90,1080);ctx.bezierCurveTo(230,920,350,980,430,790);ctx.bezierCurveTo(520,610,380,520,480,390);ctx.stroke();ctx.strokeStyle='#e8d7b5';ctx.lineWidth=88;ctx.stroke();ctx.restore();
 // 小さな石畳
 ctx.save();ctx.globalAlpha=.28;ctx.strokeStyle='#aa946e';ctx.lineWidth=1;for(let y=330;y<1350;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(770,y-100);ctx.stroke()}for(let x=10;x<760;x+=48){ctx.beginPath();ctx.moveTo(x,300);ctx.lineTo(x+180,1320);ctx.stroke()}ctx.restore();
 // カフェと住宅

 // 花壇と小さな庭
 poly([[35,430],[170,375],[245,415],[110,478]],'#9b7954');poly([[35,416],[170,360],[245,400],[110,462]],'#d2b48a');for(let i=0;i<20;i++)flower(55+(i*29)%175,397+(i*13)%56,.9);
 poly([[535,520],[630,475],[690,510],[595,558]],'#a88a62');poly([[535,504],[630,459],[690,494],[595,542]],'#dfc59b');for(let i=0;i<18;i++)flower(550+(i*23)%125,490+(i*11)%52,.95);
 poly([[10,940],[115,880],[215,925],[110,990]],'#a88a62');poly([[10,924],[115,864],[215,909],[110,974]],'#e2cba2');for(let i=0;i<18;i++)flower(30+(i*27)%170,905+(i*13)%55,.9);
 // 大きな木と低木
 function tree(x,y,r=1){ellipse(x,y+20*r,34*r,12*r,'#82714e');ctx.fillStyle='#735d43';ctx.fillRect(x-5*r,y-18*r,10*r,42*r);for(let i=0;i<18;i++){let q=i*2.4;ellipse(x+Math.cos(q)*(i%5)*8*r,y-34*r+Math.sin(q)*(i%4)*8*r,15*r,14*r,['#63884c','#7fa451','#91ae5b'][i%3])}for(let i=0;i<5;i++)flower(x-18*r+(i*17*r),y-40*r+(i%2)*13*r,.7*r)}

 // 河岸の小さな橋
 poly([[690,760],[810,705],[842,725],[720,785]],'#8b704f');poly([[690,747],[810,692],[842,712],[720,772]],'#c49a68');ctx.strokeStyle='#765b40';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(698,738);ctx.lineTo(817,684);ctx.moveTo(715,766);ctx.lineTo(835,711);ctx.stroke();
 // ベンチ、街灯、案内板

function drawChar(p,i){
 let x=p.x,y=p.y; const tall=i===0?1.13:.94; // 凪澄は夜玖よりひと回り長身
 ellipse(x,y+15,19*tall,7,'#776b51aa');

 ctx.save();ctx.translate(x,y);ctx.scale(1,tall);
 // 影と足
 ctx.strokeStyle='#383b40';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();if(p.pose==='sit'){ctx.moveTo(-5,3);ctx.lineTo(-10,9);ctx.lineTo(-3,12);ctx.moveTo(5,3);ctx.lineTo(10,9);ctx.lineTo(3,12)}else{ctx.moveTo(-5,4);ctx.lineTo(-6,15);ctx.moveTo(5,4);ctx.lineTo(7,15)}ctx.stroke();
 if(p.pose==='sit'){ellipse(-3,13,6,3,'#e9e4dc');ellipse(3,13,6,3,'#e9e4dc')}else{ellipse(-7,16,6,3,'#e9e4dc');ellipse(7,16,6,3,'#e9e4dc')}
 if(p.kind==='nagisumi'){
   // 黒い上着と細身の黒パンツ
   poly([[-12,-9],[12,-9],[14,9],[-14,9]],'#272a31',null);
   poly([[-7,-8],[0,-2],[7,-8],[4,8],[-4,8]],'#e8e7e4',null);
   ctx.strokeStyle='#d9bda9';ctx.lineWidth=5;ctx.beginPath();if(p.pose==='sit'){ctx.moveTo(-11,-5);ctx.lineTo(-8,4);ctx.moveTo(11,-5);ctx.lineTo(8,4)}else{ctx.moveTo(-11,-5);ctx.lineTo(-15,7);ctx.moveTo(11,-5);ctx.lineTo(15,7)}ctx.stroke();
   // 首・顔
   ctx.fillStyle='#e9c6b6';ctx.fillRect(-3,-13,6,7);ellipse(0,-23,12,14,'#efcdbd');
   // 銀髪、長めの前髪と後ろ髪
   ellipse(0,-31,14,10,'#c8cbd2');ellipse(-10,-23,5,13,'#b8bdc8');ellipse(10,-22,5,13,'#bfc3cc');
   poly([[-13,-30],[-8,-42],[2,-41],[12,-36],[8,-29],[3,-34],[-2,-26],[-6,-32],[-12,-25]],'#d5d7dc',null);

 }else{

   ctx.fillStyle='#e7bda9';ctx.fillRect(-3,-13,6,7);ellipse(0,-23,11,13,'#f0cdbb');
   // 黒髪の少し長いシルエット
   ellipse(0,-31,13,10,'#24232a');ellipse(-10,-23,4,12,'#24232a');ellipse(10,-22,4,12,'#24232a');
   poly([[-12,-29],[-9,-39],[0,-40],[11,-35],[8,-29],[4,-34],[0,-27],[-4,-32],[-9,-27]],'#302d35',null);
   // 眼鏡
   ctx.strokeStyle='#4b4140';ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(-4,-23,4.1,3.2,0,0,Math.PI*2);ctx.ellipse(4,-23,4.1,3.2,0,0,Math.PI*2);ctx.moveTo(0,-23);ctx.lineTo(0,-23);ctx.stroke();
   ellipse(-4,-23,1.1,1.3,'#292b35');ellipse(4,-23,1.1,1.3,'#292b35');

   ctx.strokeStyle='#34343a';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,-25,15,Math.PI*1.08,Math.PI*1.92);ctx.stroke();ellipse(-13,-20,3,5,'#34343a');ellipse(13,-20,3,5,'#34343a');

}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function addDiary(text){const stamp=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');diary.unshift({time:stamp,text});if(diary.length>80)diary.pop()}
function setAction(p,i,kind,targetX,targetY,travelText,stayText,pose='stand',duration=0){if(kind!=='bench')p.benchSeat=null;p.action=kind;p.tx=targetX;p.ty=targetY;p.activity=travelText;p.stayText=stayText;p.pose='stand';p.phaseState='moving';p.stay=duration;document.getElementById('act'+i).textContent=p.activity}
function chooseRoutine(p,i){const r=Math.random();if(sharedGoal){setAction(p,i,'date',i===0?250:310,i===0?330:365,'ふたりで喫茶店へ向かっている','喫茶店で一緒に過ごしている','stand',60);return}if(needs[i].hunger<35){setAction(p,i,'cafe',i===0?265:300,330,'喫茶店へ向かっている','喫茶店でひと休み','sit',45);return}if(needs[i].energy<28||r<.62){const seats=[{bench:0,slot:0,x:783,y:780},{bench:0,slot:1,x:807,y:780},{bench:1,slot:0,x:78,y:740},{bench:1,slot:1,x:102,y:740}];const occupied=chars.filter((c,j)=>j!==i&&c.action==='bench'&&c.benchSeat).map(c=>c.benchSeat.bench+':'+c.benchSeat.slot);const free=seats.filter(q=>!occupied.includes(q.bench+':'+q.slot));if(free.length){const seat=free[(Math.random()*free.length)|0];setAction(p,i,'bench',seat.x,seat.y,'ベンチへ向かっている','ベンチで休憩中','sit',50);p.benchSeat={bench:seat.bench,slot:seat.slot};return}}if(r<.82){const spots=[{x:145,y:430},{x:610,y:510},{x:120,y:930}];const q=spots[(Math.random()*spots.length)|0];setAction(p,i,'flowers',q.x,q.y,'花壇へ向かっている','花を眺めている','look',38);return}const q=i===0?{x:450+Math.random()*120,y:650+Math.random()*220}:{x:330+Math.random()*170,y:760+Math.random()*200};setAction(p,i,'walk',q.x,q.y,i===0?'街を見回りながら散歩中':'街を散歩中',i===0?'街の様子を眺めている':'景色を眺めている','stand',12)}
function arrive(p,i){p.phaseState='staying';p.x=p.tx;p.y=p.ty;p.activity=p.stayText;p.pose=p.action==='bench'||p.action==='cafe'?'sit':p.action==='flowers'?'look':'stand';document.getElementById('act'+i).textContent=p.activity;if(p.action==='flowers')addDiary(chars[i].name+'が花壇のそばで足を止め、花を眺めている。');if(p.action==='bench')addDiary(chars[i].name+'がベンチに座ってひと休みしている。')}
function tickLife(){needs.forEach((n,i)=>{n.energy=Math.max(8,n.energy-.12);n.hunger=Math.max(8,n.hunger-.18);n.mood=Math.max(20,Math.min(100,n.mood+(n.energy<25?-.15:.025)))});if(sharedGoal){goalTicks++;if(goalTicks>60){sharedGoal='';goalTicks=0;needs.forEach(n=>{n.hunger=Math.min(100,n.hunger+18);n.mood=Math.min(100,n.mood+12)});bond.affection=Math.min(100,bond.affection+2);bond.intimacy=Math.min(100,bond.intimacy+2);chars.forEach((p,i)=>setAction(p,i,'cafe',i===0?280:330,i===0?315:350,'喫茶店へ向かっている','喫茶店で一緒に過ごしている','sit',60));addDiary('ふたりで喫茶店へ。温かい飲み物を片手に、ゆっくり過ごした。')}}else if(hour!==lastRoutine){lastRoutine=hour;chars.forEach((p,i)=>{if(p.phaseState==='staying'&&p.stay>0){p.stay-=1;if(p.stay<=0)chooseRoutine(p,i)}else chooseRoutine(p,i)})}if(minute%10===0){needs.forEach((n,i)=>{if(chars[i].phaseState==='staying'&&(chars[i].action==='bench'||chars[i].action==='cafe')){n.energy=Math.min(100,n.energy+4);n.mood=Math.min(100,n.mood+2)}})}}
function loop(t){let dt=Math.min((t-last)/1000,.08);last=t;if(!paused){elapsed+=dt;if(elapsed>1){elapsed=0;minute++;if(minute>=60){minute=0;hour++;if(hour>=24){hour=0;day=day%7+1;addDiary('新しい一日が始まった。ふたりの暮らしは続いていく。')}}tickLife()}chars.forEach((p,i)=>{p.phase+=dt;if(p.phaseState==='moving'){let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);if(d>2){let step=Math.min(d,dt*42);p.x+=dx/d*step;p.y+=dy/d*step}else arrive(p,i)}else if(p.phaseState==='staying'&&p.stay>0){p.stay-=dt;if(p.stay<=0)chooseRoutine(p,i)}})}drawWorld();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const dayNames=['日','月','火','水','木','金','土'];function updateClock(){let s=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');document.getElementById('clock').textContent=s+'（'+dayNames[day%7]+'）';document.getElementById('smalltime').textContent=s}setInterval(updateClock,500);
function select(i){selected=i;panX=450-chars[i].x;panY=720-chars[i].y;document.querySelectorAll('.person').forEach((e,j)=>e.classList.toggle('selected',j===i));drawWorld()};document.getElementById('p0').onclick=()=>select(0);document.getElementById('p1').onclick=()=>select(1);
const activePointers=new Map();let gesture=null;
function screenToWorld(x,y){const fit=Math.min(W/900,H/1400)*1.04,scale=fit*zoom;return{x:(x-W/2)/scale+450-panX,y:(y-H/2)/scale+720-panY}}
function pointerMid(){const pts=[...activePointers.values()];return{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}}
function pointerDistance(){const pts=[...activePointers.values()];return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect(),pt={x:e.clientX-r.left,y:e.clientY-r.top,startX:e.clientX-r.left,startY:e.clientY-r.top};activePointers.set(e.pointerId,pt);if(activePointers.size===1){gesture={type:'tap',start:pt, moved:false}}else if(activePointers.size===2){const mid=pointerMid();gesture={type:'map',distance:pointerDistance(),zoom,world:screenToWorld(mid.x,mid.y),mid}}});
c.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;e.preventDefault();const r=c.getBoundingClientRect(),pt=activePointers.get(e.pointerId);pt.x=e.clientX-r.left;pt.y=e.clientY-r.top;if(gesture?.type==='tap'&&activePointers.size===1){if(Math.hypot(pt.x-pt.startX,pt.y-pt.startY)>12)gesture.moved=true}if(activePointers.size>=2&&gesture?.type==='map'){const mid=pointerMid(),dist=Math.max(20,pointerDistance()),fit=Math.min(W/900,H/1400)*1.04;zoom=Math.max(.65,Math.min(2.4,gesture.zoom*dist/Math.max(20,gesture.distance)));const scale=fit*zoom;panX=(mid.x-W/2)/scale-gesture.world.x+450;panY=(mid.y-H/2)/scale-gesture.world.y+720;drawWorld()}});
function finishPointer(e){if(!activePointers.has(e.pointerId))return;const pt=activePointers.get(e.pointerId);activePointers.delete(e.pointerId);if(activePointers.size===0){if(gesture?.type==='tap'&&!gesture.moved){const w=screenToWorld(pt.x,pt.y);const i=chars.findIndex(p=>Math.hypot(p.x-w.x,p.y-w.y)<48);if(i>=0)select(i)}gesture=null}else if(activePointers.size===1){const remain=[...activePointers.values()][0];gesture={type:'tap',start:remain,moved:true}}}
c.addEventListener('pointerup',finishPointer);c.addEventListener('pointercancel',finishPointer);
document.getElementById('zin').onclick=()=>{zoom=Math.min(2.4,zoom+.1);drawWorld()};document.getElementById('zout').onclick=()=>{zoom=Math.max(.65,zoom-.1);drawWorld()};document.getElementById('reset').onclick=()=>{zoom=1;panX=0;panY=0;drawWorld()};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.title=paused?'再開':'一時停止'};
const panel=document.getElementById('panel'),title=document.getElementById('panelTitle'),body=document.getElementById('panelBody');function meter(label,value){return '<div class="meter"><span>'+label+'</span><div class="track"><div class="fill" style="width:'+Math.round(value)+'%"></div></div><b>'+Math.round(value)+'</b></div>'}
function showTab(t,force=false){if(!force&&t===tab&&t!=='walk')t='walk';tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));panel.classList.toggle('show',t!=='walk');panel.classList.toggle('mapPanel',t==='map');if(t==='walk'){document.getElementById('hint').style.display='block';return}document.getElementById('hint').style.display='none';if(t==='map'){title.textContent='街の地図';body.innerHTML='<div class="mapGrid"><button class="actionBtn mapPlace" data-x="645" data-y="340">🏡 住宅</button><button class="actionBtn mapPlace" data-x="240" data-y="290">☕ 喫茶こもれび</button><button class="actionBtn mapPlace" data-x="600" data-y="760">🌳 川辺の広場</button></div><p class="subtle">場所の名前を押すと、地図がその場所を映します。</p>';body.querySelectorAll('.mapPlace').forEach(b=>b.onclick=()=>{panX=450-Number(b.dataset.x);panY=720-Number(b.dataset.y);drawWorld()})}if(t==='two'){title.textContent='ふたりの暮らし';body.innerHTML='<div class="entry"><b>凪澄</b>　'+chars[0].activity+'<br><small>28歳・195cm／銀髪・青い瞳／落ち着いていて責任感が強い</small></div>'+meter('元気',needs[0].energy)+meter('空腹',needs[0].hunger)+meter('気分',needs[0].mood)+'<div class="entry"><b>夜玖</b>　'+chars[1].activity+'<br><small>19歳・162cm／黒髪・眼鏡・ヘッドホン／寡黙でゲーム好き</small></div>'+meter('元気',needs[1].energy)+meter('空腹',needs[1].hunger)+meter('気分',needs[1].mood)+'<div class="metricTitle">ふたりの関係</div>'+meter('愛情',bond.affection)+meter('信頼',bond.trust)+meter('親密',bond.intimacy)+'<div class="subtle">恋人同士。日々の行動や一緒に過ごす時間で、関係性が少しずつ変化します。</div><button class="actionBtn" id="dateBtn">☕ ふたりで喫茶店へ行く</button><div class="subtle">'+(sharedGoal?'イベント進行中。ふたりは喫茶店へ向かっています。':'イベントを指示すると、ふたりの目標として行動を始めます。')+'</div>';document.getElementById('dateBtn').onclick=()=>{if(!sharedGoal){sharedGoal='cafe';goalTicks=0;chars.forEach((p,i)=>{p.tx=i===0?250:310;p.ty=i===0?330:365;p.activity='ふたりで喫茶店へ向かっている';p.action='date';p.phaseState='moving';p.pose='stand';p.stayText='喫茶店で一緒に過ごしている';document.getElementById('act'+i).textContent=p.activity});addDiary('今日はふたりで喫茶店へ行くことにした。');showTab('two',true)}}}if(t==='memories'){title.textContent='ふたりの日記';body.innerHTML=diary.map(d=>'<div class="entry"><small>'+d.time+'</small>'+d.text+'</div>').join('')}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
})();
</script></body></html>
