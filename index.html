function ensureFurnitureWorld(saved){

  if(homes[homeId].rooms?.length){homes[homeId].rooms.forEach(room=>{rooms[room.id]=room;room.furnitureIds=room.furnitureIds||[]})}else ['living','kitchen','bedroom','study'].forEach(type=>{
   const id=homeId+':'+type;
   if(!rooms[id])rooms[id]={id,homeId,name:{living:'居間',kitchen:'台所',bedroom:'寝室',study:'書斎'}[type],type,furnitureIds:[]};
  });
 });
 // 住宅配置v6：住人が現在所属していない保存済み住宅も含め、全住宅を新しい街区へ配置。
 // homes全件を対象にしないと、空き家や旧世帯の家だけ旧位置に残ってしまう。
 const homeLayoutVersion=10;
 const allHomes=Object.values(homes);
 const plotById=new Map(residentialPlots.map(plot=>[plot.id,plot]));
 const occupiedPlots=new Set();
 allHomes.forEach(home=>{
  if(home.mapLayoutVersion>=5&&plotById.has(home.mapPlotId))occupiedPlots.add(home.mapPlotId);
 });
 const freePlots=residentialPlots.filter(plot=>!occupiedPlots.has(plot.id));
 let movedHomes=false;
 allHomes.forEach(home=>{
  if(home.mapLayoutVersion>=5&&plotById.has(home.mapPlotId)){
   const plot=plotById.get(home.mapPlotId);
   if(home.x!==plot.x||home.y!==plot.y){home.x=plot.x;home.y=plot.y;movedHomes=true;}
   home.mapLayoutVersion=homeLayoutVersion;
   return;
  }
  const plot=freePlots.shift();
  if(plot){
   if(home.x!==plot.x||home.y!==plot.y||home.mapPlotId!==plot.id)movedHomes=true;
   home.mapPlotId=plot.id;home.x=plot.x;home.y=plot.y;
  }
  home.mapLayoutVersion=homeLayoutVersion;
 });
 Object.values(rooms).forEach(room=>room.furnitureIds=[]);
 furniture.forEach(item=>{const room=rooms[item.roomId];if(room&&item.homeId===room.homeId)room.furnitureIds.push(item.instanceId)});
 if(!furniture.length){
  homeIds.forEach(homeId=>{
   const hid='household:'+homeId;
   const starter=[['bed','bedroom',180,790],['fridge','kitchen',555,730],['table','living',190,500],['sofa','living',190,785],['desk','study',515,475]];
   starter.forEach(([type,roomType,x,y],i)=>{
    const def=furnitureCatalog[type],instanceId=homeId+'-'+type+'-starter';
    furniture.push({instanceId,furnitureId:type,purchaserId:'system',ownershipType:def.ownership,ownerId:def.ownership==='household'?hid:membersForHome(homeId)[0]||'',homeId,roomId:homeId+':'+roomType,x,y,rotation:0,allowedResidentIds:null,placed:true});
    rooms[homeId+':'+roomType].furnitureIds.push(instanceId);
   });
  });
 }
 if(movedHomes)saveGame();
}
function membersForHome(homeId){return chars.filter(p=>householdForResident(p).homeId===homeId).map(p=>p.id)}
function furnitureOwnerCanUse(item,residentId){

 if(Array.isArray(item.allowedResidentIds))return item.allowedResidentIds.includes(residentId);

}
function canResidentUseFurniture(residentId,action,roomId){

}
function buyFurniture(residentId,furnitureId,ownerType,ownerId,roomId){
 const buyer=residentById(residentId),def=furnitureCatalog[furnitureId];if(!buyer||!def||buyer.money<def.price)return null;
 const homeId=householdForResident(buyer).homeId,hid='household:'+homeId;
 const ownershipType=ownerType||def.ownership,actualOwner=ownerId||(ownershipType==='household'?hid:residentId);
 if(ownershipType==='household'&&actualOwner!==hid)return null;
 if(ownershipType==='individual'&&!residentById(actualOwner))return null;
 if(def.unique==='household'&&furniture.some(f=>f.homeId===homeId&&f.furnitureId===furnitureId&&f.ownershipType==='household'))return null;
 const validRoom=roomId&&rooms[roomId]?.homeId===homeId&&def.rooms.includes(rooms[roomId].type)?roomId:homeId+':'+def.rooms[0];
 buyer.money-=def.price;
 const item={instanceId:'furniture-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),furnitureId,purchaserId:residentId,ownershipType,ownerId:actualOwner,homeId,roomId:validRoom,x:0,y:0,rotation:0,allowedResidentIds:null,placed:true};
 furniture.push(item);rooms[validRoom].furnitureIds.push(item.instanceId);
 recordMoney(buyer,'expense',def.price,def.name+'を購入');
 saveGame(true);return item;
}
function giftFurniture(instanceId,ownerId){
 const item=furniture.find(f=>f.instanceId===instanceId);if(!item||!residentById(ownerId))return false;
 if(item.ownershipType==='household')return false;

 item.ownerId=ownerId;item.ownershipType='individual';item.allowedResidentIds=null;saveGame(true);return true;
}
function moveFurniture(instanceId,roomId,x,y,rotation){
 const item=furniture.find(f=>f.instanceId===instanceId),room=rooms[roomId],def=item&&furnitureCatalog[item.furnitureId];
 if(!item||!room||room.homeId!==item.homeId||!def.rooms.includes(room.type))return false;

}

const homeGeometryCache=new WeakMap();
function homeExteriorGeometry(home){
 const plot=residentialPlots.find(q=>q.id===home.mapPlotId);
 const cacheKey=home.x+','+home.y+','+home.mapPlotId;
 const cached=homeGeometryCache.get(home);if(cached?.key===cacheKey)return cached.value;
 const dx=home.x-(plot?.x||home.x),dy=home.y-(plot?.y||home.y);
 const footprint=plot?artPolygon(plot.footprint).map(q=>({x:q.x+dx,y:q.y+dy})):[{x:home.x-48,y:home.y-25},{x:home.x+48,y:home.y-25},{x:home.x+48,y:home.y+45},{x:home.x-48,y:home.y+45}];

 const value={w,h,left:-w/2,right:w/2,front,back:-h*.34,roofY:-h*.72,footprint};
 homeGeometryCache.set(home,{key:cacheKey,value});return value;

function homeBlocksMovement(home,x,y,p){

  const exit=homeApproachPoints(departure);

 }

 if(!own)return true;

 const exiting=p.phaseState==='moving'&&!['home','sleep'].includes(p.action)&&Math.hypot(p.x-door.x,p.y-door.y)<180;

function isBlockedByStructure(x,y,p){

function movementSegmentClear(x1,y1,x2,y2,p){

function findMovementDetour(p,point){
 const currentDistance=Math.hypot(point.x-p.x,point.y-p.y);
 const radii=[32,48,64,84,108,136,168,204];
 let best=null,bestScore=Infinity;
 // 目的地の周囲を細かく探索し、迂回点の前後どちらも障害物のない候補だけを採用する。
 for(const radius of radii){
  for(let i=0;i<32;i++){
   const angle=Math.PI*2*i/32;
   const candidate={x:point.x+Math.cos(angle)*radius,y:point.y+Math.sin(angle)*radius};
   if(candidate.x<24||candidate.x>1802||candidate.y<24||candidate.y>2652)continue;
   if(isBlockedByStructure(candidate.x,candidate.y,p)||!nearPaintedRoad(candidate.x,candidate.y,30)||!roadJoinFollowsPaint(p.x,p.y,candidate.x,candidate.y)||!roadJoinFollowsPaint(candidate.x,candidate.y,point.x,point.y))continue;
   const remaining=Math.hypot(point.x-candidate.x,point.y-candidate.y);
   const travel=Math.hypot(candidate.x-p.x,candidate.y-p.y);
   if(remaining>=currentDistance+8||travel<8)continue;
   if(!movementSegmentClear(p.x,p.y,candidate.x,candidate.y,p))continue;
   if(!movementSegmentClear(candidate.x,candidate.y,point.x,point.y,p))continue;
   const score=travel+remaining+radius*.025;
   if(score<bestScore){best=candidate;bestScore=score}
  }
 }
 return best;
}

// Spread newly added residents over safe walkable positions instead of

function findSafeResidentSpawn(requested=null){
 const initial=[
  {x:420,y:700},{x:448,y:732},{x:476,y:764},
  {x:504,y:796},{x:532,y:828},{x:420,y:898},
  {x:330,y:898},{x:250,y:898},{x:350,y:1040},
  {x:445,y:1010},{x:600,y:760},{x:610,y:880}
 ];
 const places=[
  ...(requested&&Number.isFinite(requested.x)&&Number.isFinite(requested.y)?[requested]:[]),
  ...initial,
  ...roadNodes.map(n=>({x:n.x,y:n.y}))
 ];
 const busy=chars.filter(p=>isOutdoorResident(p)&&Number.isFinite(p.x)&&Number.isFinite(p.y));
 const candidate={id:'new-resident-spawn',action:'walk',phaseState:'idle'};
 const clear=point=>point.x>=30&&point.x<=870&&point.y>=220&&point.y<=1310
  &&!isBlockedByStructure(point.x,point.y,candidate);
 const distanceFromCrowd=point=>busy.reduce((n,p)=>Math.min(n,Math.hypot(point.x-p.x,point.y-p.y)),Infinity);
 for(const node of roadNodes){
  for(const radius of [26,43,62])for(let k=0;k<12;k++){
   const a=k*Math.PI/6;
   places.push({x:node.x+Math.cos(a)*radius,y:node.y+Math.sin(a)*radius});
  }
 }
 const safe=places.find(point=>clear(point)&&distanceFromCrowd(point)>=40);
 if(safe)return safe;
 // Even when overcrowded, prefer the safest available spot over a duplicate spawn.
 return places.filter(clear).sort((a,b)=>distanceFromCrowd(b)-distanceFromCrowd(a))[0]||{x:420,y:700};
}

function compactRoutePoints(points,resident){

  changed=false;
  for(let i=1;i<compact.length-1;i++){
   const a=compact[i-1],b=compact[i],c=compact[i+1];
   const abx=b.x-a.x,aby=b.y-a.y,acx=c.x-a.x,acy=c.y-a.y;
   const length=Math.hypot(acx,acy);
   if(length<1)continue;

   const forward=abx*acx+aby*acy;
   if(!b.curve&&!c.curve&&deviation<=5&&forward>0&&roadJoinFollowsPaint(a.x,a.y,c.x,c.y)&&movementSegmentClear(a.x,a.y,c.x,c.y,resident)){

// Limit road joins and pedestrian avoidance to each painted lane's width.

  const t=i/count,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t,slack=6+startDistance*(1-t);

const STOP_GAP=36;
function separateArrivedResident(p){
 const settled=chars.filter(q=>q!==p&&isOutdoorResident(q)&&['staying','idle'].includes(q.phaseState));
 if(!settled.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<STOP_GAP))return;
 for(const r of [STOP_GAP,STOP_GAP+14,STOP_GAP+30,STOP_GAP+48]){
  for(let k=0;k<8;k++){
   const a=k*Math.PI/4+(r>STOP_GAP?.39:0),c={x:p.tx+Math.cos(a)*r,y:p.ty+Math.sin(a)*r};
   if(isBlockedByStructure(c.x,c.y,p)||!movementSegmentClear(p.x,p.y,c.x,c.y,p))continue;
   if(settled.some(q=>Math.hypot(q.x-c.x,q.y-c.y)<STOP_GAP))continue;
   p.x=c.x;p.y=c.y;p.tx=c.x;p.ty=c.y;return;
  }
 }
}

function relationshipThresholds(a,b){
 const minSoc=Math.min(Number(a.sociability)||50,Number(b.sociability)||50);
 const bonus=minSoc<50?Math.round((50-minSoc)*0.6):0;
 return {friend:50+bonus,best:80+Math.ceil(bonus/2)};
}
function promoteRelationship(r,status){
 r.status=status;
 if(!recordMemory('status_'+status+'_'+encodeURIComponent(r.id),status+'になった日',r.label+'の関係が深まり、'+status+'になった。',r.id)){
  addDiary(r.label+'は'+status+'になった。');
 }
 if(tab==='relations')showTab('relations',true);
}
function evaluateRelationshipPromotions(){
 const candidates=Object.values(relationships).filter(r=>!r.statusLocked&&(r.status==='知り合い'||r.status==='友人'));
 candidates.sort((x,y)=>(Number(y.affection)||0)-(Number(x.affection)||0));
 for(const r of candidates){
  const pair=(r.residentIds||[]).map(residentById);
  if(pair.length!==2||!pair[0]||!pair[1])continue;
  const th=relationshipThresholds(pair[0],pair[1]);
  if(r.status==='知り合い'&&r.trust>th.friend&&r.intimacy>th.friend)promoteRelationship(r,'友人');
  if(r.status==='友人'&&r.trust>th.friend&&r.intimacy>th.friend&&r.affection>th.best){
   const alreadyBest=id=>Object.values(relationships).some(o=>o!==r&&o.status==='親友'&&(o.residentIds||[]).includes(id));
   if(!alreadyBest(pair[0].id)&&!alreadyBest(pair[1].id))promoteRelationship(r,'親友');
  }
 }
}

function relationshipPriority(r){

 const bondScore=Math.max(0,Math.min(100,(r.affection||0)))/100;
 if(status.includes('恋人'))return 5.5+bondScore;
 if(status.includes('友人')||status.includes('親友'))return 4+bondScore;
 if(status.includes('家族'))return 3.5+bondScore;
 return 1.2+bondScore*.5;
}

// Select two nearby, walkable rendezvous points before scheduling either resident.
// A valid meeting spot must also be reachable from both residents' current positions.
function socialDestinationReachable(p,point){
 if(movementSegmentClear(p.x,p.y,point.x,point.y,p))return true;
 const route=roadRoute(p.x,p.y,point.x,point.y,null,p);
 if(route.length<2)return false;
 for(let i=1;i<route.length;i++){
  if(!movementSegmentClear(route[i-1].x,route[i-1].y,route[i].x,route[i].y,p))return false;
 }
 return Math.hypot(route[route.length-1].x-point.x,route[route.length-1].y-point.y)<2;
}
function nearPaintedRoad(x,y,radius=20){
 return paintedRoadSegments.some(([a,b])=>pointSegmentDistance(x,y,a,b)<=radius);
}
function mainRoadMeetingBlocked(x,y){
 // Include pedestrian clearance so neither member of a pair stands at the edge of the main lane.
 return paintedRoadSegments.some(([a,b])=>a.paintRadius>=36&&b.paintRadius>=36&&pointSegmentDistance(x,y,a,b)<120);
}
function socialMeetingSpots(){
 const spots=[];
 for(const bench of WORLD_STREET_FURNITURE.benches){
  if(bench.group==='cafe')continue;
  if(bench.id==='south-bench'||bench.id==='south-bench-east')continue;
  spots.push({x:bench.x,y:bench.y-14});
 }
 const cherry=PAINTED_WALK_SPOTS.find(spot=>spot.id==='garden-cherry');
 if(cherry)spots.push({x:cherry.x,y:cherry.y});
 const plaza=getPlace('plaza');
 if(plaza)spots.push({x:plaza.x,y:plaza.y});
 return spots;
}
function findSocialMeetingPoints(a,b,avoid){
 const centerX=(a.x+b.x)/2,centerY=(a.y+b.y)/2;
 let checkedRoutes=0;
 const seenNodes=new Set();
 // A spot another pair is already heading to (or using) stays out of the draw:
 // two pairs converging on the same garden corner is what jams the narrow paths.
 const busy=[];
 chars.forEach(q=>{if(q!==a&&q!==b&&q.action==='social'&&(q.phaseState==='moving'||q.phaseState==='staying')){busy.push({x:q.tx,y:q.ty});busy.push({x:q.x,y:q.y})}});
 const centers=socialMeetingSpots()
  .map(spot=>{const node=roadNodes.filter(n=>!mainRoadMeetingBlocked(n.x,n.y)).sort((u,v)=>Math.hypot(u.x-spot.x,u.y-spot.y)-Math.hypot(v.x-spot.x,v.y-spot.y))[0];if(!node||seenNodes.has(node))return null;seenNodes.add(node);return {x:node.x,y:node.y}})
  .filter(Boolean)
  .filter(center=>!busy.some(point=>Math.hypot(point.x-center.x,point.y-center.y)<110))
  .filter(center=>!avoid||Math.hypot(avoid.x-center.x,avoid.y-center.y)>=110)
  .sort((u,v)=>Math.hypot(u.x-centerX,u.y-centerY)-Math.hypot(v.x-centerX,v.y-centerY));
 for(const center of centers){
  {
   const cx=center.x,cy=center.y;
   for(let direction=0;direction<8;direction++){
    const angle=direction*Math.PI/4;
    const dx=Math.cos(angle)*24,dy=Math.sin(angle)*24;
    const first={x:cx+dx,y:cy+dy},second={x:cx-dx,y:cy-dy};
    if(mainRoadMeetingBlocked(first.x,first.y)||mainRoadMeetingBlocked(second.x,second.y))continue;
    if(!nearPaintedRoad(first.x,first.y,16)||!nearPaintedRoad(second.x,second.y,16)||isBlockedByStructure(first.x,first.y,a)||isBlockedByStructure(second.x,second.y,b))continue;
    if(!movementSegmentClear(first.x,first.y,second.x,second.y,a))continue;
    // Bound route searches so periodic social scheduling cannot stall animation.
    if(++checkedRoutes>8)return null;
    if(!socialDestinationReachable(a,first)||!socialDestinationReachable(b,second))continue;
    return {first,second};
   }
  }
 }

function showTab(t,force=false){stopResidentDiagnostics();if(!force&&t===tab&&t!=='walk')t='walk';if(t!=='relations'){expandedRelationId='';relationFolderId=''}tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));panel.classList.toggle('show',t!=='walk');panel.classList.toggle('mapPanel',t==='map');panel.classList.toggle('homePanel',t==='home');document.getElementById('mapToggle').classList.toggle('active',t==='map');document.getElementById('mapToggle').textContent=interiorHomeId?'↩︎':'🗺️';document.getElementById('mapToggle').classList.toggle('returnCity',!!interiorHomeId);document.getElementById('mapToggle').setAttribute('aria-label',interiorHomeId?'街に戻る':'地図');if(t==='walk'){document.getElementById('hint').style.display=interiorHomeId?'none':'block';if(!interiorHomeId){document.getElementById('placeTitle').textContent='街';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').innerHTML='<button id="toggleHomeResidents">住人一覧</button><button class="placeMap" id="openHomeMap">地図</button>';document.getElementById('placeActions').classList.add('show');document.getElementById('toggleHomeResidents').onclick=openPlaceResidents;document.getElementById('openHomeMap').onclick=()=>showTab('map')}else{const home=getPlace(interiorHomeId);document.getElementById('placeTitle').textContent=home?home.name:'家の中';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').classList.add('show')}renderResidentStatus();return}document.getElementById('hint').style.display='none';if(t==='map'){document.getElementById('placeTitle').textContent='街';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').innerHTML='<button id="toggleHomeResidents">住人一覧</button><button class="placeMap" id="openHomeMap">地図</button>';document.getElementById('placeActions').classList.add('show');document.getElementById('toggleHomeResidents').onclick=openPlaceResidents;document.getElementById('openHomeMap').onclick=()=>showTab('map');renderResidentStatus();title.textContent='街の地図';body.innerHTML='<div class="metricTitle">住人の家の中を覗く</div><div class="mapGrid">'+Object.values(homes).map(h=>'<button class="actionBtn enterHome" data-home="'+escapeHtml(h.id)+'">🏡 '+escapeHtml(h.name)+'の中へ</button>').join('')+'</div><div class="metricTitle">街のスポット</div><div class="mapGrid">'+places.filter(place=>place.type==='home'||place.type==='cafe'||place.type==='shop'||place.id==='plaza').map(place=>'<button class="actionBtn mapPlace" data-place="'+place.id+'">'+place.icon+' '+escapeHtml(place.name)+'</button>').join('')+'</div><p class="subtle">場所を選ぶと、その場所を地図に映します。</p>';body.querySelectorAll('.mapPlace').forEach(b=>b.onclick=()=>{const place=getPlace(b.dataset.place);if(!place)return;interiorHomeId='';homeListOpen=false;interiorZoom=1;interiorPanX=0;interiorPanY=0;panX=450-place.x;panY=720-place.y;drawWorld();showTab('walk')});body.querySelectorAll('.enterHome').forEach(b=>b.onclick=()=>{interiorHomeId=b.dataset.home;homeListOpen=false;interiorZoom=1;interiorPanX=0;interiorPanY=0;drawWorld();showTab('home')})}if(t==='home'){const home=getPlace(interiorHomeId);const household=Object.values(households).find(h=>h.homeId===interiorHomeId)||{homeId:interiorHomeId};const inventoryResident=chars.find(p=>householdForResident(p).homeId===interiorHomeId);const stock=inventoryResident?householdFoodStore(inventoryResident):householdFoodStore({homeId:interiorHomeId});title.textContent='';panel.classList.remove('show');document.getElementById('placeTitle').textContent=home?home.name:'家の中';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();const actions=document.getElementById('placeActions');actions.innerHTML='<button id="toggleHomeResidents">住人一覧</button><button class="placeMap" id="openHomeMap">地図</button>';actions.classList.add('show');document.getElementById('toggleHomeResidents').onclick=openPlaceResidents;document.getElementById('openHomeMap').onclick=()=>showTab('map',true);renderResidentStatus();return}
if(t==='residents'){

 renderResidentManager();
}
if(t==='homes'){title.textContent='家';if(homeSubPage==='search')renderHomeSearch();else if(homeSubPage==='manage')renderHomeManage();else renderHomeMenu()}
if(t==='relations'){
 ensureAllRelationships();
 const relationList=Object.values(relationships).sort((a,b)=>a.label.localeCompare(b.label,'ja'));
 const relation=relationList.find(r=>r.id===expandedRelationId);
 if(relation){
  title.textContent='';
  const pairMemories=memories.filter(m=>m.pairId===relation.id);
  body.innerHTML='<div class="relationPageHeader"><button class="relationBack" aria-label="戻る">‹</button><b>'+escapeHtml(relation.label)+'</b></div><div class="relationStatusRow" id="relationStatusRow"><span>'+escapeHtml(relation.label)+'　<span class="pill">'+escapeHtml(relation.status)+'</span></span><button type="button" class="residentJumpBtn" id="editRelationStatus">変更</button></div><div class="relationDetail">'+relationTypeSection(relation)+'<div class="metricTitle">関係パラメーター</div>'+relationMeter('愛情',relation.affection,'affection')+relationMeter('信頼',relation.trust,'trust')+relationMeter('親密',relation.intimacy,'intimacy')+relationInstructionSection(relation)+'<div class="metricTitle">ふたりの思い出</div>'+
  (pairMemories.length?pairMemories.map((m,i,arr)=>{const dayKey=Number.isFinite(m.day)?m.day:'old';const prev=i>0?(Number.isFinite(arr[i-1].day)?arr[i-1].day:'old'):null;const heading=dayKey!==prev?'<div class="metricTitle">'+(dayKey==='old'?'過去の記録':(dayKey+1)+'日目')+'</div>':'';return heading+'<div class="entry"><small>'+escapeHtml(m.time||'')+'</small><b>'+escapeHtml(m.title)+'</b><br>'+escapeHtml(m.text)+'</div>'}).join(''):'<div class="subtle">ふたりの思い出は、これから少しずつ増えていきます。</div>')+'</div>';
  body.querySelector('.relationBack').onclick=()=>{expandedRelationId='';showTab('relations',true)};

    showTab('relations',true);
   };
   document.getElementById('cancelRelationStatus').onclick=()=>showTab('relations',true);
  };
  const typeSelect=document.getElementById('relationTypeSelect');
  if(typeSelect)typeSelect.onchange=()=>{relation.relType=typeSelect.value;saveGame(true);showTab('relations',true)};
  const instrSelect=document.getElementById('pairInstructionSelect');
  if(instrSelect)instrSelect.onchange=()=>{relation.instructionKind=instrSelect.value;saveGame(true);showTab('relations',true)};
  const instrBtn=document.getElementById('applyPairInstruction');
  if(instrBtn)instrBtn.onclick=()=>{const input=document.getElementById('pairInstructionInput');const text=input?input.value.trim():'';relation.instructionText=text;if(!text){relation.instructionKind='';relation.pendingInstruction='';relation.pendingStamp=-1;saveGame(true);showTab('relations',true);return}const parsed=parsePairInstruction(text);if(parsed){if(parsed.stance!==null&&parsed.stance!==undefined)relation.instructionKind=parsed.stance;if(parsed.once){relation.pendingInstruction=parsed.once;relation.pendingStamp=calendarDay*1440+hour*60+minute}saveGame(true);showTab('relations',true)}else{saveGame(true);const note=document.getElementById('pairInstructionNote');if(note)note.textContent='この文章は解釈できませんでした（現在の解釈：'+(PAIR_INSTRUCTION_LABELS[relation.instructionKind||'']||'なし')+'）。選択肢からも選べます。'}};
  const onceSelect=document.getElementById('pairOnceSelect');
  if(onceSelect)onceSelect.onchange=()=>{relation.pendingInstruction=onceSelect.value;relation.pendingStamp=onceSelect.value?calendarDay*1440+hour*60+minute:-1;saveGame(true);showTab('relations',true)};
 }else{
  expandedRelationId='';
  const folderResident=residentById(relationFolderId);
  if(folderResident){
   title.textContent='';
   const mine=relationList.filter(r=>(r.residentIds||[]).includes(folderResident.id)).map(r=>({relation:r,partner:residentById((r.residentIds||[]).find(id=>id!==folderResident.id))})).filter(x=>x.partner).sort((a,b)=>{const rank={'恋人':0,'親友':1,'友人':2,'知り合い':3};const ra=rank[a.relation.status]??4,rb=rank[b.relation.status]??4;return ra!==rb?ra-rb:chars.indexOf(a.partner)-chars.indexOf(b.partner)});
   body.innerHTML='<div class="relationPageHeader"><button class="relationBack" aria-label="戻る">‹</button><b>'+escapeHtml(folderResident.name)+'の関係</b></div>'+(mine.length?mine.map(x=>'<button class="relationSummary" data-relation="'+escapeHtml(x.relation.id)+'"><span class="relationFaces">'+residentAvatar(x.partner)+'</span><span class="relationNames"><b>'+escapeHtml(x.partner.name)+'</b><br><span class="pill">'+escapeHtml(x.relation.status)+'</span></span><span class="relationChevron">›</span></button>').join(''):'<div class="subtle">まだ関係のある相手がいません。</div>');
   body.querySelector('.relationBack').onclick=()=>{relationFolderId='';showTab('relations',true)};
   body.querySelectorAll('.relationSummary').forEach(button=>button.onclick=()=>{expandedRelationId=button.dataset.relation;showTab('relations',true)});
  }else{
   relationFolderId='';
   title.textContent='住人同士の関係';
   body.innerHTML=chars.length>=2?chars.map(p=>{const count=relationList.filter(r=>(r.residentIds||[]).includes(p.id)).length;return '<button class="relationSummary" data-folder="'+escapeHtml(p.id)+'"><span class="relationFaces">'+residentAvatar(p)+'</span><span class="relationNames"><b>'+escapeHtml(p.name)+'の関係</b><br><span class="subtle">関係 '+count+'件</span></span><span class="relationChevron">›</span></button>'}).join(''):'<div class="subtle">住人が2人以上になると、ここに関係が表示されます。</div>';
   body.querySelectorAll('[data-folder]').forEach(button=>button.onclick=()=>{relationFolderId=button.dataset.folder;showTab('relations',true)});
  }
 }
}
