function homeBlocksMovement(home,x,y,p){
 if(!home)return false;
 const sizes={'1K':[104,92],'1DK':[116,100],'1LDK':[128,106],'2K':[138,112],'2LDK':[150,120]};
 const [w,h]=sizes[home.layoutKey]||[116,100];
 const left=home.x-w/2-9,right=home.x+w/2+9,top=home.y-h*.34-24,bottom=home.y+h*.52+31;
 if(x<left||x>right||y<top||y>bottom)return false;
 const entrance=homeEntrance(home),front=home.y+h*.52;
 const doorLane=Math.abs(x-entrance.x)<18&&y>=front-18&&y<=entrance.y+27;
 const householdId=householdForResident(p).homeId;
 const entering=(p.action==='home'||p.action==='sleep')&&householdId===home.id;
 const nearDoor=Math.hypot(p.x-entrance.x,p.y-entrance.y)<40;
 // 自宅から外出する本人は、部屋から玄関まで家の内側を歩ける。
 const exitingOwnHome=householdId===home.id&&p.phaseState==='moving'&&!entering&&p.x>=left&&p.x<=right&&p.y>=top&&p.y<=bottom;
 const candidateInsideOwnHome=exitingOwnHome&&x>=left&&x<=right&&y>=top&&y<=bottom;
 if(candidateInsideOwnHome)return false;
 // 家の外壁を越える箇所だけ玄関レーンに限定する。
 return !(doorLane&&(entering||nearDoor||exitingOwnHome));
}

 if(x>=548&&x<=692&&y>=329&&y<=444&&!shopDoor&&!atShopTarget)return true;

function movementSegmentClear(x1,y1,x2,y2,p){
 const distance=Math.hypot(x2-x1,y2-y1),steps=Math.max(2,Math.ceil(distance/8));
 for(let i=1;i<=steps;i++){
  const t=i/steps;

}
function findMovementDetour(p,point){
 const currentDistance=Math.hypot(point.x-p.x,point.y-p.y);
 const radii=[34,52,72,96,124];
 let best=null,bestScore=Infinity;
 for(const radius of radii){
  for(let i=0;i<20;i++){
   const angle=Math.PI*2*i/20;
   const candidate={x:point.x+Math.cos(angle)*radius,y:point.y+Math.sin(angle)*radius};
   if(isBlockedByStructure(candidate.x,candidate.y,p))continue;
   const remaining=Math.hypot(point.x-candidate.x,point.y-candidate.y);
   const travel=Math.hypot(candidate.x-p.x,candidate.y-p.y);
   if(remaining>=currentDistance+8||!movementSegmentClear(p.x,p.y,candidate.x,candidate.y,p))continue;
   const score=remaining+travel*.35;
   if(score<bestScore){best=candidate;bestScore=score}
  }
  if(best)break;
 }
 return best;
}

function roadNodePath(start,goal){

  const path=queue.shift(),id=path[path.length-1];
  if(id===goal.id){ids=path;break}

  const neighbors=roadNodes.filter(n=>(node?.links||[]).includes(n.id)||(n.links||[]).includes(id));

function showTab(t,force=false){if(!force&&t===tab&&t!=='walk')t='walk';if(t!=='relations')expandedRelationId='';tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));panel.classList.toggle('show',t!=='walk');panel.classList.toggle('mapPanel',t==='map');panel.classList.toggle('homePanel',t==='home');document.getElementById('mapToggle').classList.toggle('active',t==='map');document.getElementById('mapToggle').textContent=interiorHomeId?'↩︎':'🗺️';document.getElementById('mapToggle').classList.toggle('returnCity',!!interiorHomeId);document.getElementById('mapToggle').setAttribute('aria-label',interiorHomeId?'街に戻る':'地図');if(t==='walk'){document.getElementById('hint').style.display=interiorHomeId?'none':'block';if(!interiorHomeId){document.getElementById('placeTitle').textContent='川辺のこみち';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').innerHTML='<button id="toggleHomeResidents">住人一覧</button><button class="placeMap" id="openHomeMap">地図</button>';document.getElementById('placeActions').classList.add('show');document.getElementById('toggleHomeResidents').onclick=openPlaceResidents;document.getElementById('openHomeMap').onclick=()=>showTab('map')}else{const home=getPlace(interiorHomeId);document.getElementById('placeTitle').textContent=home?home.name:'家の中';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').classList.add('show')}renderResidentStatus();return}document.getElementById('hint').style.display='none';if(t==='map'){document.getElementById('placeTitle').textContent='川辺のこみち';document.getElementById('placeSubtitle').textContent='春・'+weatherLabel();document.getElementById('placeActions').innerHTML='<button id="toggleHomeResidents">住人一覧</button><button class="placeMap" id="openHomeMap">地図</button>';document.getElementById('placeActions').classList.add('show');document.getElementById('toggleHomeR
