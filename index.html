-size:12px;line-height:1.2;white-space:nowrap;overflow-wrap:normal;min-height:44px}.panel h3{margin:0 0 10px;font-size:16px}.entry{font-size:12px;line-height:1.65;padding:7px 0;border-bottom:1px solid var(--line)}.relationSummary{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px 10px;border:0;border-radius:13px;background:#edf0e5;color:var(--ink);font:inherit;text-align:left}.relationPageHeader{position:sticky;top:-16px;z-index:2;display:flex;align-items:center;gap:12px;margin:0 -16px 10px;padding:8px 16px 11px;background:var(--cream);border-bottom:1px solid var(--line);font-size:15px}.relationBack{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:#edf0e5;color:var(--green);font-size:28px;line-height:1;padding:0 0 3px}.relationSummary b{font-size:13px}.relationChevron{color:var(--green);font-size:18px}.relationDetail{padding:4px 8px 8px}.eventTrigger{margin-top:16px}.actionBtn{display:block;width:100%;border:0;border-radius:14px;padding:12px;margin:10px 0 4px;background:#778768;color:white;font:inherit;font-weight:700}.meter{display:grid;grid-template-columns:52px 1fr 32px;gap:8px;align-items:center;font-size:11px;margin:7px 0}.track{height:8px;border-radius:9px;background:#e7e0d2;overflow:hidden}.fill{height:100%;border-radius:9px;background:#91a17d}.metricTitle{font-size:13px;font-weight:700;margin:12px 0 5px}.subtle{font-size:11px;color:#988b77;line-height:1.6}.residentTools{display:flex;gap:7px;margin:8px 0}.residentTools button,.residentRow button{border:0;border-radius:11px;padding:8px 10px;background:#edf0e5;color:var(--ink);font:inherit;font-size:12px}.residentRow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.residentRow .avatar{width:30px;height:34px}.residentRow .residentInfo{flex:1;min-width:0}.residentForm{display:grid;gap:8px;margin-top:10px;padding:11px;border-radius:14px;background:#f4f0e6}.residentForm label{display:grid;gap:4px;font-size:11p <script>
(()=>{const c=document.getElementById('world'),ctx=c.getContext('2d');let W=0,H=0,dpr=1,zoom=1,panX=0,panY=0,interiorHomeId='',paused=false,minute=25,hour=15,day=2,selected=0,tab='walk',last=0,elapsed=0;const defaultResidents=[{id:'nagisumi',name:'凪澄',profile:{role:'住人',detail:'28歳・195cm／銀髪・青い瞳／落ち着いていて責任感が強い'},needs:{energy:86,hunger:72,mood:82},x:390,y:470,tx:500,ty:570,phase:0,activity:'夜玖を見守りながら散歩中',color:'#252a32',hair:'#c9cbd1',kind:'nagisumi',scale:1.13},{id:'yaku',name:'夜玖',profile:{role:'住人',detail:'19歳・162cm／黒髪・眼鏡・ヘッドホン／寡黙でゲーム好き'},needs:{energy:74,hunger:68,mood:88},x:520,y:800,tx:430,ty:690,phase:2,activity:'のんびり散歩中',color:'#e6e3df',hair:'#24232a',kind:'yaku',scale:.94}];const chars=defaultResidents.map(p=>({...p,profile:{...p.profile},needs:{...p.needs}}));let bond={affection:68,trust:76,intimacy:61};let relationships={};let diary=[{time:'15:25',text:'凪澄と夜玖が川辺のこみちを散歩している。'}];let memories=[];let unlockedEvents={};let expandedRelationId='';let editingResidentId='';let residentPageId='';let sharedGoal='';let goalTicks=0;let lastRoutine=0;let lastRecoveryStamp=-1;let lastBondStamp=-1;let lastSocialPairId='';let sameSocialPairCount=0;
const places=[
 {id:'home',name:'西の住宅',icon:'🏡',x:645,y:340,type:'home',description:'住人たちが暮らす家',actions:['帰宅','休憩']},
 {id:'home2',name:'東の住宅',icon:'🏠',x:250,y:470,type:'home',description:'住人たちが暮らす家',actions:['帰宅','休憩']},
 {id:'cafe',name:'喫茶こもれび',icon:'☕',x:240,y:290,type:'cafe',description:'飲み物を楽しめる喫茶店',actions:['食事','休憩','デート']},
 {id:'plaza',name:'川辺の広場',icon:'🌳',x:600,y:760,type:'outdoor',description:'川辺の散歩や休憩を楽しめる広場',actions:['散歩','休憩']},
 {id:'bench-river',name:'川辺のベンチ',icon:'🪑',x:795,y:800,type:'bench',description:'水の流れを眺めながら休めるベンチ',actions:['休憩']},
 {id:'bench-path',name:'こみちのベンチ',icon:'🪑',x:90,y:760,type:'bench',description:'木陰のそばでひと休みできるベンチ',actions:['休憩']},
 {id:'bridge',name:'小さな橋',icon:'🌉',x:765,y:738,type:'bridge',description:'川辺をつなぐ小さな橋。水辺の景色を眺められる場所',actions:['散歩','景色を見る']},
 {id:'flower-west',name:'西の花壇',icon:'🌼',x:140,y:425,type:'garden',description:'色とりどりの花が咲く、住宅近くの花壇',actions:['花を見る']},
 {id:'flower-east',name:'東の花壇',icon:'🌷',x:610,y:500,type:'garden',description:'広場のそばにある、日当たりのよい花壇',actions:['花を見る']},
 {id:'flower-south',name:'南の花壇',icon:'🌻',x:115,y:920,type:'garden',description:'こみちの南側にある小さな花壇',actions:['花を見る']}
];
function getPlace(id){return places.find(place=>place.id===id)||null}
const SAVE_KEY='komichi-life-save-v1';
let saveElapsed=0;
function pairIdFor(a,b){const ids=[typeof a==='string'?a:a.id,typeof b==='string'?b:b.id].sort();return ids[0]==='nagisumi'&&ids[1]==='yaku'?'nagisumi-yaku':'pair:'+encodeURIComponent(JSON.stringify(ids))}
function residentById(id){return chars.find(p=>p.id===id)||null}
function relationshipLabel(ids){return ids.map(id=>residentById(id)?.name||id).join(' ＆ ')}
function ensureRelationship(a,b,seed){
 const ids=[typeof a==='string'?a:a.id,typeof b==='string'?b:b.id].sort(),id=pairIdFor(ids[0],ids[1]);
 if(!residentById(ids[0])||!residentById(ids[1])||ids[0]===ids[1])return null;
 if(!relationships[id]){
  const original=id==='nagisumi-yaku';
  relationships[id]={id,residentIds:ids,label:relationshipLabel(ids),status:original?'恋人':'知り合い',affection:original?68:20,trust:original?76:20,intimacy:original?61:10,lastInteractionStamp:-1,lastSocialStamp:-1,lastSocialVisitStamp:-1,...(seed||{})};
 }
 const r=relationships[id];r.id=id;r.residentIds=ids;r.label=relationshipLabel(ids);
 ['affection','trust','intimacy'].forEach(k=>{r[k]=Number.isFinite(r[k])?Math.max(0,Math.min(100,r[k])):(id==='nagisumi-yaku'?bond[k]:20)});
 if(typeof r.status!=='string')r.status=id==='nagisumi-yaku'?'恋人':'知り合い';
 if(!Number.isFinite(r.lastInteractionStamp))r.lastInteractionStamp=-1;
 if(!Number.isFinite(r.lastSocialStamp))r.lastSocialStamp=-1;
 if(!Number.isFinite(r.lastSocialVisitStamp))r.lastSocialVisitStamp=-1;
 return r;
}
function ensureAllRelationships(){
 for(let i=0;i<chars.length;i++)for(let j=i+1;j<chars.length;j++)ensureRelationship(chars[i],chars[j]);
 const primary=ensureRelationship('nagisumi','yaku');if(primary)bond=primary;
 return relationships;
}
function relationshipFor(a,b){return ensureRelationship(a,b)}
function restoreRelationships(saved,legacyBond){
 relationships={};
 if(saved&&typeof saved==='object')Object.entries(saved).forEach(([id,value])=>{
  if(!value||!Array.isArray(value.residentIds)||value.residentIds.length!==2)return;
  const [a,b]=value.residentIds;if(!residentById(a)||!residentById(b))return;
  const key=pairIdFor(a,b);relationships[key]={...value,id:key,residentIds:[a,b].sort()};
 });
 if(!relationships['nagisumi-yaku']&&legacyBond&&typeof legacyBond==='object')relationships['nagisumi-yaku']={id:'nagisumi-yaku',residentIds:['nagisumi','yaku'],label:'凪澄 ＆ 夜玖',status:'恋人',affection:legacyBond.affection,trust:legacyBond.trust,intimacy:legacyBond.intimacy,lastInteractionStamp:-1};
 ensureAllRelationships();
}
function relationMeter(label,value,key){return '<div class="meter" data-relation-stat="'+key+'"><span>'+label+'</span><div class="track"><div class="fill" style="width:'+Math.round(value)+'%"></div></div><b>'+Math.round(value)+'</b></div>'}
function saveGame(){
 try{
  const data={version:3,savedAt:Date.now(),clock:{hour,minute,day},bond:{affection:bond.affection,trust:bond.trust,intimacy:bond.intimacy},relationships,lastSocialPairId,sameSocialPairCount,diary:diary.slice(0,300),memories:memories.slice(0,100),unlockedEvents,sharedGoal,goalTicks,lastRoutine,lastRecoveryStamp,lastBondStamp,selected,view:{zoom,panX,panY},residents:chars.map(p=>({...p,profile:{...p.profile},needs:{...p.needs}}))};
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
 }catch(e){console.warn('セーブに失敗しました',e)}
}
function loadGame(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
  const data=JSON.parse(raw);if(!data||![1,2,3].includes(data.version))return false;lastSocialPairId=typeof data.lastSocialPairId==='string'?data.lastSocialPairId:'';sameSocialPairCount=Number.isFinite(data.sameSocialPairCount)?Math.max(0,data.sameSocialPairCount):0;
  if(data.clock){hour=Number.isFinite(data.clock.hour)?data.clock.hour:hour;minute=Number.isFinite(data.clock.minute)?data.clock.minute:minute;day=Number.isFinite(data.clock.day)?data.clock.day:day}
  
  if(data.bond)Object.keys(bond).forEach(k=>{if(Number.isFinite(data.bond[k]))bond[k]=Math.max(0,Math.min(100,data.bond[k]))});
  if(Array.isArray(data.diary))diary=data.diary.filter(d=>d&&typeof d.time==='string'&&typeof d.text==='string').slice(0,300);if(Array.isArray(data.memories))memories=data.memories.filter(m=>m&&typeof m.time==='string'&&typeof m.title==='string'&&typeof m.text==='string'&&(m.pairId||m.title==='ふたりの喫茶店時間')).map(m=>m.title==='ふたりの喫茶店時間'?{...m,pairId:m.pairId||'nagisumi-yaku'}:m).slice(0,100);if(data.unlockedEvents&&typeof data.unlockedEvents==='object')unlockedEvents=data.unlockedEvents;
  sharedGoal=typeof data.sharedGoal==='string'?data.sharedGoal:'';goalTicks=Number.isFinite(data.goalTicks)?data.goalTicks:0;lastRoutine=Number.isFinite(data.lastRoutine)?data.lastRoutine:0;lastRecoveryStamp=Number.isFinite(data.lastRecoveryStamp)?data.lastRecoveryStamp:-1;lastBondStamp=Number.isFinite(data.lastBondStamp)?data.lastBondStamp:-1;
  if(Number.isInteger(data.selected))selected=Math.max(0,data.selected);
  if(data.view){if(Number.isFinite(data.view.zoom))zoom=Math.max(.65,Math.min(2.4,data.view.zoom));if(Number.isFinite(data.view.panX))panX=data.view.panX;if(Number.isFinite(data.view.panY))panY=data.view.panY}
  const savedResidents=Array.isArray(data.residents)?data.residents:(Array.isArray(data.chars)?data.chars.map((p,i)=>({...p,needs:data.needs?.[i]})):null);
  if(savedResidents){
   const restored=savedResidents.map((saved,i)=>{
    const base=defaultResidents.find(p=>p.id===saved.id)||defaultResidents[i]||{};
    return {...base,...saved,profile:{...(base.profile||{}),...(saved.profile||{})},needs:{energy:80,hunger:75,mood:80,...(base.needs||{}),...(saved.needs||{})},sociability:Number.isFinite(saved.sociability)?Math.max(0,Math.min(100,saved.sociability)):50,curiosity:Number.isFinite(saved.curiosity)?Math.max(0,Math.min(100,saved.curiosity)):50,activityLevel:Number.isFinite(saved.activityLevel)?Math.max(0,Math.min(100,saved.activityLevel)):50,walkPreference:Number.isFinite(saved.walkPreference)?Math.max(0,Math.min(100,saved.walkPreference)):50,naturePreference:Number.isFinite(saved.naturePreference)?Math.max(0,Math.min(100,saved.naturePreference)):50,cafePreference:Number.isFinite(saved.cafePreference)?Math.max(0,Math.min(100,saved.cafePreference)):50,lastInitiatedSocialStamp:Number.isFinite(saved.lastInitiatedSocialStamp)?saved.lastInitiatedSocialStamp:-1,lastSocialStamp:Number.isFinite(saved.lastSocialStamp)?saved.lastSocialStamp:-1};
   });
   chars.splice(0,chars.length,...restored);
  }
  selected=Math.min(selected,Math.max(0,chars.length-1));
  restoreRelationships(data.relationships,data.bond);
  renderResidentStatus();
  return true;
 }catch(e){console.warn('セーブデータを読み込めませんでした',e);return false}
}
const hasSave=loadGame();
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function safeColor(value,fallback){return /^#[0-9a-f]{3,8}$/i.test(String(value||''))?value:fallback}
function residentAvatar(p){
 if(p.kind==='nagisumi')return '<svg class="avatar" viewBox="0 0 40 44"><circle cx="20" cy="14" r="11" fill="#efcdbd"/><path d="M8 17Q7 3 21 3Q34 4 32 19L28 13Q20 18 10 13Z" fill="#c9cbd1"/><path d="M14 25Q20 21 26 25L30 42H10Z" fill="#272a31"/><path d="M12 29L28 29L27 42H13Z" fill="#e8e7e4"/></svg>';
 if(p.kind==='yaku')return '<svg class="avatar" viewBox="0 0 40 44"><circle cx="20" cy="14" r="11" fill="#e5b99b"/><path d="M8 18Q5 4 19 3Q34 3 33 20L30 29L27 18Q17 22 9 17Z" fill="#24232a"/><path d="M13 26Q20 22 27 26L30 42H10Z" fill="#4b7590"/><path d="M13 27H27L26 42H14Z" fill="#527e9b"/></svg>';
 const hair=safeColor(p.hair,'#655b4c'),shirt=safeColor(p.color,'#778768');
 return '<svg class="avatar" viewBox="0 0 40 44"><circle cx="20" cy="14" r="11" fill="#e8c4ae"/><path d="M8 18Q7 3 20 3Q34 3 32 19L28 13Q19 18 10 13Z" fill="'+hair+'"/><path d="M13 26Q20 22 27 26L30 42H10Z" fill="'+shirt+'"/></svg>';
}
function renderResidentStatus(){
 const root=document.getElementById('residentStatus');if(!root)return;
 root.innerHTML=chars.map((p,i)=>'<div class="person '+(i===selected?'selected':'')+'" data-index="'+i+'">'+residentAvatar(p)+'<div><div class="pname">'+escapeHtml(p.name)+'</div><div class="activity">'+escapeHtml(p.activity||'街を散歩中')+'</div></div></div>').join('');

function chooseFreshSpot(p,spots){
 const recent=Array.isArray(p.recentSpots)?p.recentSpots:[];
 const fresh=spots.filter(s=>!recent.includes(s.id));
 const pool=fresh.length?fresh:spots;
 const curiosity=Math.max(0,Math.min(100,p.curiosity??50));
 const candidates=curiosity>=65&&fresh.length?fresh:pool;
 const chosen=candidates[(Math.random()*candidates.length)|0];
 p.recentSpots=[...recent.filter(id=>id!==chosen.id),chosen.id].slice(-4);
 return chosen;
}

 const relation=romanticPairs.find(r=>r.residentIds.includes(p.id));
 if(relation){const partnerId=relation.residentIds.find(id=>id!==p.id);const pairIndex=romanticPairs.findIndex(r=>r.id===relation.id);return {homeId:pairIndex%2===0?'home':'home2',partner:residentById(partnerId)}}
 const index=chars.findIndex(other=>other.id===p.id);
 // 恋人世帯がある場合、単身住人はその世帯とは反対側の住宅へ。
 if(romanticPairs.length){const firstPairHome=romanticPairs[0]&&'home';return {homeId:firstPairHome==='home'?'home2':'home',partner:null}}
 return {homeId:index%2===0?'home':'home2',partner:null};
}
function dailyScheduleFor(p){

  body.innerHTML='<div class="residentPageHeader"><button class="relationBack" id="residentPageBack">‹</button><b>住人を編集</b></div><form class="residentForm" id="residentForm"><label>名前<input name="name" maxlength="24" required value="'+escapeHtml(editing.name)+'"></label><label>プロフィール<textarea name="detail" maxlength="180">'+escapeHtml(editing.profile?.detail||'')+'</textarea></label><label>社交性 <span class="subtle" id="sociabilityValue">'+Math.round(editing.sociability??50)+' / 100</span><input name="sociability" type="range" min="0" max="100" step="5" value="'+Math.round(editing.sociability??50)+'"></label><label>好奇心 <span class="subtle" id="curiosityValue">'+Math.round(editing.curiosity??50)+' / 100</span><input name="curiosity" type="range" min="0" max="100" step="5" value="'+Math.round(editing.curiosity??50)+'"></label><label>活動性 <span class="subtle" id="activityLevelValue">'+Math.round(editing.activityLevel??50)+' / 100</span><input name="activityLevel" type="range" min="0" max="100" step="5" value="'+Math.round(editing.activityLevel??50)+'"></label><div class="colorFields"><label>髪色<input name="hair" type="color" value="'+safeColor(editing.hair,'#655b4c')+'"></label><label>服の色<input name="color" type="color" value="'+safeColor(editing.color,'#778768')+'"></label></div><div class="formActions"><button type="submit">保存</button><button type="button" id="cancelResidentEdit">キャンセル</button></div></form>';
  document.getElementById('residentPageBack').onclick=()=>{editingResidentId='';renderResidentManager()};
  const form=document.getElementById('residentForm');['sociability','curiosity','activityLevel'].forEach(key=>{const slider=form.elements[key],value=document.getElementById(key+'Value');slider.addEventListener('input',()=>{value.textContent=Number(slider.value)+' / 100'})});form.onsubmit=e=>{e.preventDefault();const p=residentById(editingResidentId);if(!p)return;const fd=new FormData(form);p.name=String(fd.get('name')||'').trim()||p.name;p.profile={...p.profile,detail:String(fd.get('detail')||'').trim()};p.sociability=Math.max(0,Math.min(100,Number(fd.get('sociability'))||0));p.curiosity=Math.max(0,Math.min(100,Number(fd.get('curiosity'))||0));p.activityLevel=Math.max(0,Math.min(100,Number(fd.get('activityLevel'))||0));p.hair=safeColor(fd.get('hair'),'#655b4c');p.color=safeColor(fd.get('color'),'#778768');ensureAllRelationships();renderResidentStatus();saveGame();editingResidentId='';renderResidentManager()};document.getElementById('cancelResidentEdit').onclick=()=>{editingResidentId='';renderResidentManager()};
  return;
 }
 if(viewing){
  body.innerHTML='<div class="residentPageHeader"><button class="relationBack" id="residentPageBack">‹</button><b>住人の詳細</b></div><div class="residentProfileHero">'+residentAvatar(viewing)+'<div><h3>'+escapeHtml(viewing.name)+'</h3><div class="subtle">'+escapeHtml(viewing.activity||'街を散歩中')+'</div></div></div><div class="metricTitle">プロフィール</div><div class="residentProfileText">'+escapeHtml(viewing.profile?.detail||'プロフィール情報は未登録です。')+'</div><div class="metricTitle">現在の状態</div>'+meter('元気',viewing.needs.energy)+meter('空腹',viewing.needs.hunger)+meter('気分',viewing.needs.mood)+'<button class="actionBtn" id="editResidentFromDetail">この住人を編集</button>';
  document.getElementById('residentPageBack').onclick=()=>{residentPageId='';renderResidentManager()};
  document.getElementById('editResidentFromDetail').onclick=()=>{editingResidentId=viewing.id;renderResidentManager()};
  return;
 }
 body.innerHTML='<div class="residentTools"><button id="addResidentBtn">＋ 住人を追加</button></div>'+
 chars.map(p=>'<div class="residentRow">'+residentAvatar(p)+'<div class="residentInfo"><button class="residentNameButton" data-view-resident="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</button><div class="subtle">'+escapeHtml(p.activity||'街を散歩中')+'</div></div><button data-edit-resident="'+escapeHtml(p.id)+'">編集</button><button data-remove-resident="'+escapeHtml(p.id)+'">退去</button></div>').join('')+
 '<div class="subtle">名前を押すと住人の詳細を確認できます。</div>';
 document.getElementById('addResidentBtn').onclick=()=>{const p=addResident({name:'新しい住人',detail:'',hair:'#655b4c',color:'#778768'});if(p){residentPageId=p.id;renderResidentManager()}};
 body.querySelectorAll('[data-view-resident]').forEach(b=>b.onclick=()=>{residentPageId=b.dataset.viewResident;renderResidentManager()});
 body.querySelectorAll('[data-edit-resident]').forEach(b=>b.onclick=()=>{editingResidentId=b.dataset.editResident;renderResidentManager()});
 body.querySelectorAll('[data-remove-resident]').forEach(b=>b.onclick=()=>{const id=b.dataset.removeResident,p=residentById(id);if(!p||chars.length<=1){alert('最後の1人は退去できません。');return}if(!confirm(p.name+'を街から退去させますか？'))return;const idx=chars.indexOf(p);const removedPairIds=new Set(Object.entries(relationships).filter(([,rel])=>rel.residentIds?.includes(id)).map(([pairId])=>pairId));chars.splice(idx,1);relationships=Object.fromEntries(Object.entries(relationships).filter(([,rel])=>!rel.residentIds?.includes(id)));memories=memories.filter(m=>!m.pairId||!removedPairIds.has(m.pairId));if(selected>=chars.length)selected=chars.length-1;else if(idx<selected)selected--;editingResidentId='';residentPageId='';ensureAllRelationships();renderResidentStatus();saveGame();renderResidentManager()});
}
function showTab(t,force=false){if(!force&&t===tab&&t!=='walk')t='walk';if(t!=='relations')expandedRelationId='';tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));panel.classList.toggle('show',t!=='walk');panel.classList.toggle('mapPanel',t==='map');document.getElementById('mapToggle').classList.toggle('active',t==='map');if(t==='walk'){document.getElementById('hint').style.display='block';return}document.getElementById('hint').style.display='none';if(t==='map'){title.textContent='街の地図';body.innerHTML='<div class="metricTitle">住人の家の中を覗く</div><div class="mapGrid"><button class="actionBtn enterHome" data-home="home">🏡 西の住宅の中へ</button><button class="actionBtn enterHome" data-home="home2">🏠 東の住宅の中へ</button></div><div class="metricTitle">街のスポット</div><div class="mapGrid">'+places.map(place=>'<button class="actionBtn mapPlace" data-place="'+place.id+'">'+place.icon+' '+place.name+'</button>').join('')+'</div><p class="subtle">場所を選ぶと、その場所を地図に映します。</p>';body.querySelectorAll('.mapPlace').forEach(b=>b.onclick=()=>{const place=getPlace(b.dataset.place);if(!place)return;panX=450-place.x;panY=720-place.y;drawWorld();showTab('walk')});body.querySelectorAll('.enterHome').forEach(b=>b.onclick=()=>{interiorHomeId=b.dataset.home;drawWorld();showTab('home')})}if(t==='home'){const home=getPlace(interiorHomeId);title.textContent=home?home.name+'の中':'家の中';const residents=chars.filter(p=>householdForResident(p).homeId===interiorHomeId);body.innerHTML='<button class="actionBtn" id="leaveHome">街へ戻る</button><div class="metricTitle">この家にいる住人</div>'+(residents.length?residents.map(p=>'<div class="entry">'+escapeHtml(p.name)+'：'+escapeHtml(p.activity||'家で過ごしている')+'</div>').join(''):'<div class="subtle">今は誰もいません。</div>');document.getElementById('leaveHome').onclick=()=>{interiorHomeId='';showTab('walk');drawWorld()};return}
if(t==='residents'){
 title.textContent='街の住人';
 renderResidentManager();
}
if(t==='relations'){
 ensureAllRelationships();
 const relationList=Object.values(relationships).sort((a,b)=>a.label.localeCompare(b.label,'ja'));
 const relation=relationList.find(r=>r.id===expandedRelationId);
 if(relation){
  title.textContent='';
  const pairMemories=memories.filter(m=>m.pairId===relation.id);
  body.innerHTML='<div class="relationPageHeader"><button class="relationBack" aria-label="戻る">‹</button><b>'+escapeHtml(relation.label)+'</b></div><div class="relationDetail"><div class="metricTitle">関係パラメーター</div>'+relationMeter('愛情',relation.affection,'affection')+relationMeter('信頼',relation.trust,'trust')+relationMeter('親密',relation.intimacy,'intimacy')+'<div class="metricTitle">ふたりの思い出</div>'+
  (pairMemories.length?pairMemories.map(m=>'<div class="entry"><small>'+escapeHtml(m.time)+'</small><b>'+escapeHtml(m.title)+'</b><br>'+escapeHtml(m.text)+'</div>').join(''):'<div class="subtle">ふたりの思い出は、これから少しずつ増えていきます。</div>')+'</div>';
  body.querySelector('.relationBack').onclick=()=>{expandedRelationId='';showTab('relations',true)};
 }else{
  expandedRelationId='';
  title.textContent='住人同士の関係';
  body.innerHTML=relationList.length?relationList.map(r=>'<button class="relationSummary" data-relation="'+escapeHtml(r.id)+'">'+residentPairFaces(r)+'<span class="relationNames"><b>'+escapeHtml(r.label)+'</b><br><span class="pill">'+escapeHtml(r.status)+'</span></span><span class="relationChevron">›</span></button>').join(''):'<div class="subtle">住人が2人以上になると、ここに関係が表示されます。</div>';
  body.querySelectorAll('.relationSummary').forEach(button=>button.onclick=()=>{expandedRelationId=button.dataset.relation;showTab('relations',true)});
 }
}
if(t==='memories'){
 title.textContent='住人の行動ログ';
 body.innerHTML=diary.length?diary.map(d=>'<div class="entry"><small>'+d.time+'</small>'+d.text+'</div>').join(''):'<div class="subtle">住人たちの行動がここに記録されます。</div>';
}
}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.getElementById('mapToggle').onclick=()=>showTab('map');
c.addEventListener('click',()=>{if(panel.classList.contains('show'))showTab('walk')});
})();
</script></body></html>
